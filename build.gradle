        println("vmArgs:")

        def vmArgs = vscodeFetchJVMArguments({ runs.client.realiseJvmArguments() })

        println(vmArgs)

        println("==================================")

        println("args:")

        def programArgs = vscodeFetchProgramArguments({ runs.client.getProgramArguments().get() })

        println(programArgs)

        println("==================================")

