plugins {
    id 'eclipse'
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.0.0"
}

version = '1.18.61'
group = 'com.github.dashiedev'
archivesBaseName = "DoggyTalentsNext[Fabric]-${project.minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets {
    api {
        compileClasspath = configurations.compileClasspath
    }
    main {
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
        resources.srcDirs += 'src/generated/resources'
    }
    test {
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
    }
}

tasks.named("processResources") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task apiJar(type: Jar) {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    archiveClassifier = 'api'
    from sourceSets.api.output
    from sourceSets.api.allJava
}

configurations { 
    apiImplementation.extendsFrom(implementation)
    apiRuntimeOnly.extendsFrom(runtimeOnly)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

//Fabric
sourceSets.main.resources { srcDir 'src/fabric_generated/resources' }

repositories {

    // Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }

}

loom {
	accessWidenerPath = file("src/main/resources/doggytalents.accesswidener")
    runs {
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagen"
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/fabric_generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=doggytalents"
 
            runDir "build/datagen"
        }
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.0"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

	implementation 'javax.inject:javax.inject:1'
	implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

jar {
    from sourceSets.main.output
    from sourceSets.api.output

    manifest {
        attributes([
            "Specification-Title": "Doggy Talents Next",
            "Specification-Vendor": "dashiedev",
            "Specification-Version": project.version,
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"dashiedev",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishMods {
    file = jar.archiveFile
    changelog = "" //To be filled when running task dtnPrepareChangelogForModPublish
    type = STABLE
    displayName = file.map { it.asFile.name }
    modLoaders.add("fabric")
    final def dtnMcVersions = ["1.21", "1.21.1"]

    curseforge {
        accessToken = providers.gradleProperty("DTN_CURSEFORGE_TOKEN")
        
        projectId = "694492"

        dtnMcVersions.each { version -> minecraftVersions.add(version)}

        changelogType = "text"
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
    }
    modrinth {
        accessToken = providers.gradleProperty("DTN_MODRINTH_TOKEN")
        
        projectId = "oXgmplvv"

        dtnMcVersions.each { version -> minecraftVersions.add(version)}
    }
}

task dtnPrepareChangelogForModPublish {
    final def changelog_path = "dtn_changelog_temp.txt";
    
    inputs.file(changelog_path) 
    outputs.upToDateWhen { false } 
    
    doLast {
        def changelog_file = file(changelog_path)
        if (!changelog_file.exists())
            throw new GradleException("Changelog " + changelog_path + " can't be found.")
        def changelog_content = changelog_file.text
        if (changelog_content.isEmpty())
            throw new GradleException("Changelog is Empty!")
        def build_version = project.version
        if (!changelog_content.contains(build_version))
            throw new GradleException(
                "Changelog does not contain this build's version number! "
                + "The current build version is: [ " + build_version + " ]. "
                + "You might have forgotten to update the file."
            )
        def publishMods_extension = project.extensions.getByName("publishMods")
        publishMods_extension.changelog = changelog_content

        logger.lifecycle("Fetched changelog from: " + changelog_path)
        logger.lifecycle("PUBLISHING CHANGELOG CONTENT======================")
        logger.lifecycle("\n" + changelog_content + "\n")
        logger.lifecycle("==================================================")
    }
}

tasks.named('publishMods') {
    mustRunAfter(tasks.named('dtnPrepareChangelogForModPublish'))
    dependsOn('dtnPrepareChangelogForModPublish')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}