plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id "me.modmuss50.mod-publish-plugin" version "1.0.0"
}

version = '1.18.63'
group = 'com.github.dashiedev'
archivesBaseName = "DoggyTalentsNext-${project.target_mc_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets {
    api
    main {
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
        resources.srcDirs += 'src/generated/resources'
    }
}

tasks.named("processResources") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task apiJar(type: Jar) {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    archiveClassifier = 'api'
    from sourceSets.api.output
    from sourceSets.api.allJava
}

configurations { 
    apiImplementation.extendsFrom(implementation)
    apiRuntimeOnly.extendsFrom(runtimeOnly)
}

minecraft {

    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            taskName 'doggytalents_client'
            workingDirectory file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                doggytalents.sources((SourceSet[]) [sourceSets.main, sourceSets.api])
            }
        }

        server {
            taskName 'doggytalents_server'
            workingDirectory file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods {
                doggytalents.sources((SourceSet[]) [sourceSets.main, sourceSets.api])
            }
        }

        data {
            taskName 'doggytalents_data'
            workingDirectory file('run')
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'doggytalents', '--all', '--output', '"' + file('src/generated/resources/') + '"', '--existing', '"' + sourceSets.main.resources.srcDirs[0] + '"'
            mods {
                doggytalents.sources((SourceSet[]) [sourceSets.main, sourceSets.api])
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
}

dependencies {

    minecraft 'net.minecraftforge:forge:1.20.1-47.1.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

jar {
    from sourceSets.main.output
    from sourceSets.api.output

    manifest {
        attributes([
            "Specification-Title": "Doggy Talents Next",
            "Specification-Vendor": "dashiedev",
            "Specification-Version": project.version,
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"dashiedev",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishMods {
    file = jar.archiveFile
    changelog = "" //To be filled when running task dtnPrepareChangelogForModPublish
    type = STABLE
    displayName = file.map { it.asFile.name }
    modLoaders.add("forge")
    final def dtnMcVersions = ["1.20", "1.20.1"]

    curseforge {
        accessToken = providers.gradleProperty("DTN_CURSEFORGE_TOKEN")
        
        projectId = "694492"

        dtnMcVersions.each { version -> minecraftVersions.add(version)}

        changelogType = "text"
        javaVersions.add(JavaVersion.VERSION_17)
        clientRequired = true
        serverRequired = true
    }
    modrinth {
        accessToken = providers.gradleProperty("DTN_MODRINTH_TOKEN")
        
        projectId = "oXgmplvv"

        dtnMcVersions.each { version -> minecraftVersions.add(version)}
    }
}

task dtnPrepareChangelogForModPublish {
    final def changelog_path = "dtn_changelog_temp.txt";
    
    inputs.file(changelog_path) 
    outputs.upToDateWhen { false } 
    
    doLast {
        def changelog_file = file(changelog_path)
        if (!changelog_file.exists())
            throw new GradleException("Changelog " + changelog_path + " can't be found.")
        def changelog_content = changelog_file.text
        if (changelog_content.isEmpty())
            throw new GradleException("Changelog is Empty!")
        def build_version = project.version
        if (!changelog_content.contains(build_version))
            throw new GradleException(
                "Changelog does not contain this build's version number! "
                + "The current build version is: [ " + build_version + " ]. "
                + "You might have forgotten to update the file."
            )
        def publishMods_extension = project.extensions.getByName("publishMods")
        publishMods_extension.changelog = changelog_content

        logger.lifecycle("Fetched changelog from: " + changelog_path)
        logger.lifecycle("PUBLISHING CHANGELOG CONTENT======================")
        logger.lifecycle("\n" + changelog_content + "\n")
        logger.lifecycle("==================================================")
    }
}

tasks.named('publishMods') {
    mustRunAfter(tasks.named('dtnPrepareChangelogForModPublish'))
    dependsOn('dtnPrepareChangelogForModPublish')
    mustRunAfter(tasks.named('reobfJar')) // Forge 1.20- only
    dependsOn('reobfJar') // Forge 1.20- only
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    add sourceSets.main, "doggytalents.refmap.json"
    config 'doggytalents.mixins.json'
    config 'doggytalents.forge_mixins.json'
}