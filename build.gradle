plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id "me.modmuss50.mod-publish-plugin" version "1.0.0"
}

version = '26.1.2.11'
group = 'com.github.dashiedev'
// Note: Ensure 'target_mc_version' is defined in your gradle.properties
base {
    archivesName = "DoggyTalentsNext-${project.target_mc_version}"
}

// Java 25 is required for NeoForge 26.1.2
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    api
    main {
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
    }
}

afterEvaluate {
    // The 'api' sourceSet needs NeoForge/Minecraft on its classpath to compile
    configurations.apiCompileClasspath.extendsFrom(configurations.modDevCompileDependencies)
    configurations.apiRuntimeClasspath.extendsFrom(configurations.modDevRuntimeDependencies)
}

// --- NEW NEOFORGE BLOCK (Replaces old 'minecraft' and top-level 'runs') ---
neoForge {
    // This handles the version and the 'neoforge' dependency automatically
    version = "26.1.2.29-beta"

    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            // Modern data gen arguments are often handled automatically, 
            // but you can add custom ones here if needed.
            programArguments.addAll '--mod', 'doggytalents', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', sourceSets.main.resources.srcDirs[0].getAbsolutePath()
        }
    }

    mods {
        doggytalents {
            sourceSet sourceSets.main
            sourceSet sourceSets.api
        }
    }
}

// Keep your generated resources linked
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // In ModDev 2.0, you generally DON'T need 'implementation "net.neoforged:neoforge:..."' 
    // The 'neoForge { version = "..." }' block handles it for you!
}

// --- PUBLISHING & JAR LOGIC ---
tasks.named("processResources") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from sourceSets.main.output
    from sourceSets.api.output
    manifest {
        attributes([
            "Specification-Title": "Doggy Talents Next",
            "Specification-Vendor": "dashiedev",
            "Specification-Version": project.version,
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"dashiedev",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishMods {
    file = jar.archiveFile
    changelog = "" 
    type = STABLE
    modLoaders.add("neoforge")
    
    // Updated for 26.1.x
    final def dtnMcVersions = ["26.1", "26.1.1", "26.1.2"]

    curseforge {
        accessToken = providers.gradleProperty("DTN_CURSEFORGE_TOKEN")
        projectId = "694492"
        minecraftVersions.set(dtnMcVersions)
        javaVersions.add(JavaVersion.VERSION_25)
    }
    
    modrinth {
        accessToken = providers.gradleProperty("DTN_MODRINTH_TOKEN")
        projectId = "oXgmplvv"
        minecraftVersions.set(dtnMcVersions)
    }
}

task dtnPrepareChangelogForModPublish {

    final def changelog_path = "dtn_changelog_temp.txt";



    inputs.file(changelog_path)

    outputs.upToDateWhen { false }



    doLast {

        def changelog_file = file(changelog_path)

        if (!changelog_file.exists())

            throw new GradleException("Changelog " + changelog_path + " can't be found.")

        def changelog_content = changelog_file.text

        if (changelog_content.isEmpty())

            throw new GradleException("Changelog is Empty!")

        def build_version = project.version

        if (!changelog_content.contains(build_version))

            throw new GradleException(

                "Changelog does not contain this build's version number! "

                + "The current build version is: [ " + build_version + " ]. "

                + "You might have forgotten to update the file."

            )

        def publishMods_extension = project.extensions.getByName("publishMods")

        publishMods_extension.changelog = changelog_content



        logger.lifecycle("Fetched changelog from: " + changelog_path)

        logger.lifecycle("PUBLISHING CHANGELOG CONTENT======================")

        logger.lifecycle("\n" + changelog_content + "\n")

        logger.lifecycle("==================================================")

    }

}



tasks.named('publishMods') {

    mustRunAfter(tasks.named('dtnPrepareChangelogForModPublish'))

    dependsOn('dtnPrepareChangelogForModPublish')

}



tasks.withType(JavaCompile).configureEach {

    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xmaxerrs" << "10000"

}



tasks.withType(ProcessResources).configureEach {

    var replaceProperties = [

        minecraft_version_range: minecraft_version_range,

        neoforge_version_range : neoforge_version_range,

        neofml_version_range   : neofml_version_range,

        file: [

            jarVersion: version

        ]

    ]

    inputs.properties replaceProperties



    filesMatching(['META-INF/neoforge.mods.toml']) {

        expand replaceProperties

    }

}



