# Higher memory is recommended for 26.1.x due to the new "Cuteness Overload" rendering logic
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JDK_25_HOME
org.gradle.java.home=/usr/lib/jvm/jdk-25.0.2-oracle-x64

# Minecraft 26.1.2 (Tiny Takeover Update)
target_mc_version=26.1.2
neoforge_version=26.1.2.29-beta

# Version Ranges for neoforge.mods.toml (Drop-based ranges)
minecraft_version_range=[26,27)
neoforge_version_range=[26,27)
neofml_version_range=[11,12)

# Project Identifiers
curseforge_project_id=694492
modrinth_project_id=oXgmplvv
